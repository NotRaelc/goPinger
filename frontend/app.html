<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>goPinger // monitor</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>

<header>
  <div class="logo">[ goPinger ]</div>
  <span class="live" id="live">○ OFFLINE</span>
  <div>
    <span class="live" id="live">○ OFFLINE</span>
    <span class="who" id="who"></span>
    <button class="ghost" onclick="logout()">ВЫЙТИ</button>
  </div>
</header>

<section class="checker">
  <div class="sec-h"><span class="bar"></span><span class="txt">ПРОВЕРКА АДРЕСА</span></div>
  <div class="row">
    <input id="ipAddr" placeholder="play.example.com:25565"
           onkeydown="if(event.key==='Enter')checkAddr()">
    <select id="ipType" style="width:240px">
      <option value="0">AUTO</option>
      <option value="2">MINECRAFT JAVA (modern)</option>
      <option value="3">MINECRAFT JAVA (legacy)</option>
      <option value="4">MINECRAFT BEDROCK</option>
      <option value="1">SOURCE (A2S)</option>
    </select>
    <button onclick="checkAddr()">ПРОВЕРИТЬ</button>
  </div>
  <div class="result" id="ipResult"></div>
</section>

<main>
  <div class="toolbar">
    <div class="left">
      <div class="sec-h"><span class="bar"></span><span class="txt">МОИ СЕРВЕРЫ</span></div>
      <span class="hint">клик по строке — <b>развернуть</b> / <b>свернуть</b> детали</span>
    </div>
    <div class="right">
      <div class="colpicker">
        <button class="ghost" onclick="toggleColPicker(event)">⚙ КОЛОНКИ</button>
        <div class="colpicker-menu" id="colPickerMenu"></div>
      </div>
      <button class="ghost" onclick="loadServers()">↻ ОБНОВИТЬ</button>
      <button onclick="openAdd()">+ ДОБАВИТЬ</button>
    </div>
  </div>
  <table>
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div class="modal" id="mAdd">
  <div class="box">
    <h3 id="addTitle">НОВЫЙ СЕРВЕР</h3>
    <label>АДРЕС (host или host:port)</label>
    <input id="fAddr" placeholder="play.example.com:25565">
    <label>ТИП</label>
    <select id="fType">
      <option value="0">AUTO</option>
      <option value="2">MINECRAFT JAVA (modern)</option>
      <option value="3">MINECRAFT JAVA (legacy)</option>
      <option value="4">MINECRAFT BEDROCK</option>
      <option value="1">SOURCE (A2S)</option>
    </select>
    <label>ИНТЕРВАЛ ОПРОСА (сек, 0 = авто по типу)</label>
	<input id="fInterval" type="number" min="0" value="0">
    <label>МЕТКА (необязательно)</label>
    <input id="fLabel" placeholder="prod / dev / любимый сервер">
    <div class="actions">
      <button class="ghost" onclick="closeModal('mAdd')">ОТМЕНА</button>
      <button onclick="saveServer()">СОХРАНИТЬ</button>
    </div>
  </div>
</div>

</body>
</html>
